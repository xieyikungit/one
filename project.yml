name: LifeUnlocked
options:
  bundleIdPrefix: com.neon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 有迹
    INFOPLIST_KEY_NSHealthShareUsageDescription: 有迹读取你在 Apple 健康中的步数，用于展示步数并计算运动经验。
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LifeUnlocked:
    type: application
    platform: iOS
    sources:
      - LifeUnlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neon.LifeUnlocked
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LifeUnlocked/LifeUnlocked.entitlements
  LifeUnlockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LifeUnlockedTests
    dependencies:
      - target: LifeUnlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neon.LifeUnlockedTests
  LifeUnlockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LifeUnlockedUITests
    dependencies:
      - target: LifeUnlocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neon.LifeUnlockedUITests
